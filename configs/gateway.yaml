# 网关基础配置
server:
  addr: ":18080"
  # 网关自身的 API Key。留空表示不鉴权（仅建议本机使用）。
  api_keys: []
  # 单次请求的全局超时。aki 插件内部轮询上限约 4 分钟，这里放宽到 300s。
  request_timeout: "300s"
  max_body_bytes: 8388608

limits:
  # 每个插件同时处理的请求数上限
  per_plugin_concurrency: 2
  # 每个插件的每秒请求数（令牌桶）
  per_plugin_rps: 1
  max_retries: 2

plugins:
  # aki.io：DeepSeek V4.1 Flash Playground（C 类纯文本，无 function tools）
  # 来源：https://github.com/lingqia/free-api-plunges
  # 匿名访客 key 每个 UTC 日仅 3 次，因此限流压到很低；
  # 可在控制台为该插件录入注册用户的 api_key 提额。
  - name: aki
    command: ./plugins/aki/bin/aki
    priority: 30
    tools: none
    timeout: "300s"
    per_plugin_rps: 0.05
    env:
      AKI_ENDPOINT: "deepseek_v4_1_flash"
    models:
      - deepseek-v4.1-flash
    auth:
      type: api_key
      optional_fields:
        - api_key
